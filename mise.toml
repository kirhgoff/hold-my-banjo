# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
bun = "1.3.14"
hk = "2.8.1"
pkl = "0.32.2"
betterleaks = "1.9.0"
typos = "1.51.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
cargo-deny = "0.20.2"
"github:agent-sh/agnix" = "0.59.3"
"github:bnjbvr/cargo-machete" = "0.9.2"

[tools.rust]
version = "1.99.1"
components = "rustfmt,clippy"
targets = "wasm32-unknown-unknown"

[tasks.setup]
description = "Install web dependencies and the git hooks"
run = ["cd web && bun install --frozen-lockfile", "hk install"]

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
